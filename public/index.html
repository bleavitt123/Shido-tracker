<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIDO JEET CLEANER - Live Tracker</title>
    <!-- Include Ethers.js library directly in the client layer -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        :root { 
            --bg-dark: #0b0c0e; 
            --card-dark: #121418; 
            --shido-neon: #00ff66; 
            --jeet-red: #e74c3c; 
            --text-light: #f5f6fa; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; text-align: center; }
        .dashboard { max-width: 600px; margin: 0 auto; background: var(--card-dark); border: 1px solid #1f242d; padding: 20px; border-radius: 12px; }
        .ca { font-family: monospace; color: #2ecc71; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; display: block; margin: 10px 0; font-size: 0.85rem; word-break: break-all; }
        .arena { height: 180px; background: #161a21; border-radius: 8px; margin: 15px 0; display: flex; justify-content: space-around; align-items: center; position: relative; overflow: hidden; border: 1px solid #252d3a; }
        .sprite { font-size: 3.5rem; transition: transform 0.1s ease; }
        .pop { position: absolute; font-size: 1.5rem; font-weight: bold; font-style: italic; opacity: 0; transition: all 0.5s ease; pointer-events: none; z-index: 10; }
        .hp-track { background: #2c3e50; height: 15px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .hp-fill { background: linear-gradient(90deg, #e74c3c, #ff7675); height: 100%; width: 100%; transition: width 0.2s; }
        .log { background: #0b0c0e; height: 120px; overflow-y: auto; text-align: left; padding: 10px; font-family: monospace; font-size: 0.8rem; border-radius: 6px; border: 1px solid #1f242d; margin-top: 15px; }
        .buy { color: var(--shido-neon); } .sell { color: var(--jeet-red); }
        .strike { transform: translateX(40px) scale(1.1); }
        .hurt { transform: translateX(10px) color: #ff7675; }
    </style>
</head>
<body>

<div class="dashboard">
    <h2 style="color: var(--shido-neon);">🥷 SHIDO JEET CLEANER</h2>
    <p style="color: #7f8c8d; font-size: 0.85rem;">High-Load Router Pipeline Monitor</p>
    <div class="ca">0xF3983368eA8926e2Ec6d3846047A8ac26D4c46c1</div>

    <div style="display: flex; justify-content: space-between; margin-top: 15px; font-weight: bold;">
        <div>MCAP: <span id="mcap" style="color: var(--shido-neon);">$1,702</span></div>
        <div>PURGED: <span id="purged" style="color: var(--jeet-red);">0</span></div>
    </div>

    <div class="arena">
        <div class="pop" id="pop"></div>
        <div class="sprite" id="ninja">🥷</div>
        <div class="sprite" id="jeet">🤡</div>
    </div>

    <div class="hp-track"><div class="hp-fill" id="hp"></div></div>
    <div class="log" id="log"></div>
</div>

<script>
    const INCREMENT = 5000;
    const TOKEN_ADDRESS = "0xF3983368eA8926e2Ec6d3846047A8ac26D4c46c1".toLowerCase();
    
    // 📡 UPGRADED NATIVE LOAD-BALANCED RPC GATEWAY PIPELINE FROM CHAINLIST
    const SHIDO_RPC_URL = "https://lb.routeme.sh/rpc/evm/9008"; 
    
    const BUBBLE_CURVE_FACTORY = "0x897931fBf08f02931a264dB073BdB1C9A1476100";
    const FACTORY_ABI = [
        "event TokenBuy(address indexed token, address indexed buyer, uint256 tokenAmount, uint256 shidoAmount, uint256 newMarketCap)",
        "event TokenSell(address indexed token, address indexed seller, uint256 tokenAmount, uint256 shidoAmount, uint256 newMarketCap)"
    ];

    let currentMarketCap = 1702; 
    let jeetsKilled = 0;

    async function initializeFactoryEventListener() {
        try {
            addLog("Piping into load-balanced ChainList node route...");
            const provider = new ethers.providers.JsonRpcProvider(SHIDO_RPC_URL);
            const factoryContract = new ethers.Contract(BUBBLE_CURVE_FACTORY, FACTORY_ABI, provider);
            addLog("Connection verified! Listening for direct platform data...");

            factoryContract.on("TokenBuy", (token, buyer, tokenAmount, shidoAmount, newMarketCap) => {
                if (token.toLowerCase() === TOKEN_ADDRESS) {
                    let previousCap = currentMarketCap;
                    let latestCapUsd = Math.floor(parseFloat(ethers.utils.formatUnits(newMarketCap, 6)));
                    if (latestCapUsd === 0) latestCapUsd = currentMarketCap + 12;

                    currentMarketCap = latestCapUsd;
                    let jeetsKilled = Math.floor(currentMarketCap / INCREMENT);
                    processLayoutSync({ marketCap: currentMarketCap, jeetsKilled }, true, (currentMarketCap - previousCap));
                }
            });

            factoryContract.on("TokenSell", (token, seller, tokenAmount, shidoAmount, newMarketCap) => {
                if (token.toLowerCase() === TOKEN_ADDRESS) {
                    let previousCap = currentMarketCap;
                    let latestCapUsd = Math.floor(parseFloat(ethers.utils.formatUnits(newMarketCap, 6)));
                    
                    currentMarketCap = latestCapUsd;
                    let jeetsKilled = Math.floor(currentMarketCap / INCREMENT);
                    processLayoutSync({ marketCap: currentMarketCap, jeetsKilled }, false, (previousCap - currentMarketCap));
                }
            });

        } catch (error) {
            addLog("Node route busy. Re-mapping network handle...");
            setTimeout(initializeFactoryEventListener, 4000);
        }
    }

    function processLayoutSync(state, isBuy, delta) {
        document.getElementById('mcap').innerText = `$${state.marketCap.toLocaleString()}`;
        document.getElementById('purged').innerText = state.jeetsKilled;
        
        let currentFloor = Math.floor(state.marketCap / INCREMENT) * INCREMENT;
        let rem = (currentFloor + INCREMENT) - state.marketCap;
        document.getElementById('hp').style.width = `${(rem / INCREMENT) * 100}%`;

        if (isBuy) {
            animateCombat(`⚔️ STRIKE +$${delta}!`, "buy");
            addLog(`🟢 ROUTER SYNC: Direct purchase log filtered successfully!`);
        } else {
            animateCombat(`⚠️ DUMP -$${delta}`, "sell");
            addLog(`🔴 ROUTER SYNC: Liquidity withdrawal log parsed.`);
        }
    }

    function animateCombat(txt, type) {
        let n = document.getElementById('ninja');
        let j = document.getElementById('jeet');
        let p = document.getElementById('pop');
        p.innerText = txt; p.style.color = type === 'buy' ? 'var(--shido-neon)' : 'var(--jeet-red)';
        p.style.opacity = '1'; p.style.transform = 'translateY(-20px)';
        if(type === 'buy') { n.classList.add('strike'); j.classList.add('hurt'); }
        setTimeout(() => {
            n.classList.remove('strike'); j.classList.remove('hurt');
            p.style.opacity = '0'; p.style.transform = 'translateY(0)';
        }, 300);
    }

    function addLog(msg) {
        let l = document.getElementById('log');
        l.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>` + l.innerHTML;
    }

    let initialJeets = Math.floor(currentMarketCap / INCREMENT);
    let initialFloor = Math.floor(currentMarketCap / INCREMENT) * INCREMENT;
    let initialRem = (initialFloor + INCREMENT) - currentMarketCap;
    document.getElementById('hp').style.width = `${(initialRem / INCREMENT) * 100}%`;
    document.getElementById('purged').innerText = initialJeets;

    initializeFactoryEventListener();
</script>
</body>
</html>
